name: Build Self Lab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q self_lab_phone_bundle.zip -d bundle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configure JVM compatibility
        working-directory: bundle/phone_bundle/project_payload
        run: |
          cat >> gradle.properties <<'EOF'
          kotlin.jvm.target.validation.mode=warning
          EOF

      - name: Build APK
        working-directory: bundle/phone_bundle/project_payload
        run: |
          gradle assembleDebug --no-daemon \
            -Pandroid.injected.testOnly=false

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find bundle/phone_bundle/project_payload -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: self-lab-apk
          path: bundle/phone_bundle/project_payload/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
