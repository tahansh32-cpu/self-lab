name: Build Self Lab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract uploaded bundle
        run: |
          unzip -q self_lab_phone_bundle.zip -d bundle
          unzip -q bundle/self-lab-project.zip -d project

      - name: Find Android project
        run: |
          echo "Searching for Android project..."
          find project -name settings.gradle.kts -o -name settings.gradle
          find project -name build.gradle.kts -o -name build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug --no-daemon

      - name: Find APK
        run: |
          find project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: self-lab-apk
          path: project/**/build/outputs/apk/debug/*.apk
