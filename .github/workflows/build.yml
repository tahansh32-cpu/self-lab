name: Build Self Lab APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q self_lab_phone_bundle.zip -d bundle

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Configure JVM targets
        working-directory: bundle/phone_bundle/project_payload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("build.gradle")) + list(Path(".").rglob("build.gradle.kts"))

          for file in files:
              text = file.read_text()

              if file.name == "build.gradle":
                  text += r'''

          // CI JVM compatibility
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions.jvmTarget = "17"
          }

          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          '''

              else:
                  text += r'''

          // CI JVM compatibility
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          '''

              file.write_text(text)
              print("Configured:", file)

          gradle_properties = Path("gradle.properties")

          if gradle_properties.exists():
              text = gradle_properties.read_text()
          else:
              text = ""

          if "kotlin.jvm.target.validation.mode" not in text:
              text += "\nkotlin.jvm.target.validation.mode=error\n"

          gradle_properties.write_text(text)
          PY

      - name: Build APK
        working-directory: bundle/phone_bundle/project_payload
        run: |
          gradle clean assembleDebug --no-daemon

      - name: Find APK
        run: |
          find bundle/phone_bundle/project_payload -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: self-lab-apk
          path: bundle/phone_bundle/project_payload/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
